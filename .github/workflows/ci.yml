name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build DSOptimizer.sln -c Release

      - name: Test (unit + pokrycie Core >= 90%)
        run: dotnet test tests/DSOptimizer.Tests.Unit/DSOptimizer.Tests.Unit.csproj -c Release --no-build /p:CollectCoverage=true /p:Threshold=90 /p:ThresholdType=line "/p:Include=[DSOptimizer.Core]*" --logger "trx;LogFileName=unit.trx"

      - name: Test (Windows – piaskownica HKCU, PowerShell, journal)
        if: ${{ !cancelled() }}
        run: dotnet test tests/DSOptimizer.Tests.Windows/DSOptimizer.Tests.Windows.csproj -c Release --no-build --logger "trx;LogFileName=windows.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
