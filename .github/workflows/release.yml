name: Release

# Tag v* = wydanie ROBOCZE (draft) na GitHubie; workflow_dispatch = tylko artefakt, bez publikacji.
# Wariant (SingleExe/Folder) jest w jednym miejscu: tools/release/variant.txt.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      INNO_URL: 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
      INNO_SHA256: 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c'
      INNO_SIGNER: 'Pyrsys B.V.'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Zwykły build i testy PRZED wydaniem: restore z /p:DsoSingleExe=true zostawia Fody w obj\project.assets.json,
      # więc po Build-Release.ps1 nie wolno już budować ani pomijać restore.
      - name: Build
        run: dotnet build DSOptimizer.sln -c Release

      - name: Test (unit + pokrycie Core >= 90%)
        run: dotnet test tests/DSOptimizer.Tests.Unit/DSOptimizer.Tests.Unit.csproj -c Release --no-build /p:CollectCoverage=true /p:Threshold=90 /p:ThresholdType=line "/p:Include=[DSOptimizer.Core]*" --logger "trx;LogFileName=unit.trx"

      - name: Test (Windows – piaskownica HKCU, PowerShell, journal)
        run: dotnet test tests/DSOptimizer.Tests.Windows/DSOptimizer.Tests.Windows.csproj -c Release --no-build --logger "trx;LogFileName=windows.trx"

      # Inno Setup przypiety: adres, SHA256 i podpis Authenticode sprawdzane przed instalacja (kompilator instalatora).
      - name: Inno Setup (przypieta wersja)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Setup = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          Invoke-WebRequest -UseBasicParsing -Uri $env:INNO_URL -OutFile $Setup
          $Hash = (Get-FileHash -LiteralPath $Setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Hash -ne $env:INNO_SHA256) { throw "SHA256 Inno Setup niezgodny: $Hash" }
          $Sig = Get-AuthenticodeSignature -LiteralPath $Setup
          if ($Sig.Status -ne 'Valid') { throw "Podpis Inno Setup: $($Sig.Status)" }
          if ($Sig.SignerCertificate.Subject -notlike "*$env:INNO_SIGNER*") { throw "Inny wydawca podpisu Inno Setup: $($Sig.SignerCertificate.Subject)" }
          $InnoDir = Join-Path $env:RUNNER_TEMP 'inno'
          $Proc = Start-Process -FilePath $Setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', ('/DIR="' + $InnoDir + '"') -Wait -PassThru
          if ($Proc.ExitCode -ne 0) { throw "Instalacja Inno Setup: kod $($Proc.ExitCode)" }
          $Iscc = Join-Path $InnoDir 'ISCC.exe'
          # Wczesny blad tuz po instalacji Inno (Build-Release tez odmawia DSO_ISCC bez pliku).
          if (-not (Test-Path -LiteralPath $Iscc)) { throw "Brak ISCC.exe po instalacji: $Iscc" }
          $Utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [IO.File]::AppendAllText($env:GITHUB_ENV, "DSO_ISCC=$Iscc`n", $Utf8NoBom)
      - name: Wydanie (Build-Release.ps1)
        id: release
        shell: powershell
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Variant = (Get-Content -LiteralPath tools/release/variant.txt -Raw).Trim()
          $IsTag = $env:REF_TYPE -eq 'tag'
          if ($IsTag) {
            & .\tools\release\Build-Release.ps1 -Variant $Variant -Tag $env:REF_NAME -OutRoot out
          } else {
            & .\tools\release\Build-Release.ps1 -Variant $Variant -OutRoot out
          }
          if ($LASTEXITCODE -ne 0) { throw "Build-Release.ps1 zakonczyl sie kodem $LASTEXITCODE" }
          $Dirs = @(Get-ChildItem -LiteralPath out -Directory)
          if ($Dirs.Count -ne 1) { throw "Oczekiwano jednego katalogu wydania w out, jest $($Dirs.Count)" }
          $Dir = $Dirs[0]
          $Version = ($Dir.Name -replace '^v', '') -replace "-$Variant$", ''
          if ($Variant -eq 'Folder') {
            $Expected = @("DSOptimizer-$Version.zip", "DSOptimizer-$Version-setup.exe", 'SHA256SUMS.txt')
          } else {
            $Expected = @("DSOptimizer-$Version.exe", 'SHA256SUMS.txt')
          }
          $Actual = @(Get-ChildItem -LiteralPath $Dir.FullName -File | ForEach-Object { $_.Name } | Sort-Object)
          if ((($Actual -join '|')) -ne ((@($Expected | Sort-Object)) -join '|')) { throw "Zawartosc wydania: $($Actual -join ', ') zamiast: $($Expected -join ', ')" }
          # Bez BOM: zapis z kodowaniem utf8 w PowerShell 5.1 dopisuje BOM, ktory psuje nazwe pierwszego wyjscia.
          $Utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "variant=$Variant`n", $Utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$Version`n", $Utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "dir=$($Dir.FullName)`n", $Utf8NoBom)

      - name: Sprawdzenie SHA256SUMS.txt
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Dir = '${{ steps.release.outputs.dir }}'
          $Lines = @(Get-Content -LiteralPath (Join-Path $Dir 'SHA256SUMS.txt') | Where-Object { $_ -ne '' })
          $Files = @(Get-ChildItem -LiteralPath $Dir -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' })
          if ($Lines.Count -ne $Files.Count) { throw "Linii w sumach: $($Lines.Count), plikow wydania: $($Files.Count)" }
          foreach ($Line in $Lines) {
            $Hash, $Name = $Line -split '  ', 2
            $Actual = (Get-FileHash -LiteralPath (Join-Path $Dir $Name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($Actual -ne $Hash) { throw "SHA256 niezgodny dla $Name" }
            Write-Host "OK $Name $Hash"
          }

      # Wydany exe sprawdzony przez CLI (--list-install z pustego folderu); bez ponownego budowania.
      - name: Smoke wydanego exe (SingleExe)
        if: ${{ steps.release.outputs.variant == 'SingleExe' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Exe = Get-ChildItem -LiteralPath '${{ steps.release.outputs.dir }}' -Filter 'DSOptimizer-*.exe' | Select-Object -First 1
          $env:DSO_SINGLE_EXE_PATH = $Exe.FullName
          dotnet test tests/DSOptimizer.Tests.Windows/DSOptimizer.Tests.Windows.csproj -c Release --no-build --filter "FullyQualifiedName~SingleExeResourcesTests"
          if ($LASTEXITCODE -ne 0) { throw "Smoke wydanego exe: kod $LASTEXITCODE" }

      # Prawdziwa instalacja, aktualizacja i odinstalowanie na runnerze (nigdy na hoscie autora).
      - name: Smoke instalatora (Folder)
        if: ${{ steps.release.outputs.variant == 'Folder' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Dir = '${{ steps.release.outputs.dir }}'
          $Version = '${{ steps.release.outputs.version }}'
          & .\tools\release\Test-InstallerSmoke.ps1 -InstallerPath (Join-Path $Dir "DSOptimizer-$Version-setup.exe") -ZipPath (Join-Path $Dir "DSOptimizer-$Version.zip") -Version $Version -LogDirectory (Join-Path $env:RUNNER_TEMP 'smoke')
          if ($LASTEXITCODE -ne 0) { throw "Smoke instalatora: kod $LASTEXITCODE" }
      - name: Artefakt wydania
        uses: actions/upload-artifact@v4
        with:
          name: wydanie-${{ steps.release.outputs.version }}-${{ steps.release.outputs.variant }}
          path: ${{ steps.release.outputs.dir }}

      # Tylko push tagu: ręczne workflow_dispatch na tagu też ma github.ref = refs/tags/v…, a ma dać sam artefakt.
      - name: Wydanie robocze na GitHubie
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Dir = '${{ steps.release.outputs.dir }}'
          $Version = '${{ steps.release.outputs.version }}'
          $Notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          $NotesText = "DSOptimizer $Version (wariant ${{ steps.release.outputs.variant }}). Sumy kontrolne w SHA256SUMS.txt: Get-FileHash <plik> -Algorithm SHA256.`n`n| File | Description |`n| --- | --- |`n| ``DSOptimizer-$Version.zip`` | Portable: unpack and run, nothing is installed; also runs from a USB drive. |`n| ``DSOptimizer-$Version-setup.exe`` | Installer: Program Files for all users, Start menu and desktop shortcuts, uninstall in Settings. |`n| winget | ``winget install dsoptimizer`` once the package is accepted. |`n"
          [IO.File]::WriteAllText($Notes, $NotesText, (New-Object System.Text.UTF8Encoding $false))
          $Files = @(Get-ChildItem -LiteralPath $Dir -File | ForEach-Object { $_.FullName })
          gh release create $env:REF_NAME --draft --title "DSOptimizer $Version" --notes-file $Notes @Files
          if ($LASTEXITCODE -ne 0) { throw "gh release create: kod $LASTEXITCODE" }
